[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry-one"
version = "1.0.0"
description = "Interactive historical Formula 1 driver ELO visualizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2,<3", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
telemetry-one-build = "historical_xw.visualizer_cli_v8:main"

[tool.hatch.build.targets.wheel]
packages = ["src/historical_xw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

